[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "device-provisioning"
version = "3.0.0"
description = "Karaali QR-authenticated encrypted BLE Linux Wi-Fi provisioning"
requires-python = ">=3.9"
dependencies = [
  "pyhpke==0.6.3",
  "cryptography==46.0.3",
  "bless==0.2.6",
  "bleak==0.22.3",
  "qrcode[png]==8.2",
  "pypng==0.20220715.0",
  "dbus-next==0.2.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
device-provision = "device_provision.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
